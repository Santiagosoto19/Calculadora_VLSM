# En local, setup.sh fija 127.0.0.1:8501.
# En Streamlit Community Cloud no se fija la dirección: la plataforma
# publica el puerto y un origen distinto de localhost.
[server]
headless = true
runOnSave = true
fileWatcherType = "auto"
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "auto"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#1B4F8A"
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
font = "sans-serif"

[theme.light]
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
primaryColor = "#1B4F8A"

# Consola clara: el bloque oscuro repite la paleta para que los
# widgets no inviertan si el cliente pide tema oscuro.
[theme.dark]
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
primaryColor = "#1B4F8A"
