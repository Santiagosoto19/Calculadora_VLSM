[server]
address = "127.0.0.1"
port = 8501
headless = true
runOnSave = true
fileWatcherType = "auto"
enableCORS = true
enableXsrfProtection = true
corsAllowedOrigins = ["http://127.0.0.1:8501", "http://localhost:8501"]

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "auto"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#1B4F8A"
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
font = "sans-serif"

[theme.light]
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
primaryColor = "#1B4F8A"

# Consola clara: el bloque oscuro repite la paleta para que los
# widgets no inviertan si el cliente pide tema oscuro.
[theme.dark]
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#1C1915"
primaryColor = "#1B4F8A"
